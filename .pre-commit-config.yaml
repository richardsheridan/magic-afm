# Hooks run the tools from the pixi `lint` environment, so the versions match
# `pixi run fmt` / `pixi run lint`. Install with `pixi run -e lint prek install`,
# which adds both the pre-commit and commit-msg shims.
#
# Local rules, untracked and shared by all worktrees, are files in
# `.git/local-hooks/<stage>.d/` (stage `pre-commit` or `commit-msg`); the
# `local-rules-*` hooks run them through `tools/local_hooks.py`. A commit-msg rule
# gets the path of the message file; a pre-commit rule gets no arguments and asks
# `git diff --cached --name-only` for the staged files. See the script's docstring
# for which files count as rules.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: local-rules-pre-commit
        name: local rules (pre-commit)
        entry: pixi run --frozen -e lint python tools/local_hooks.py pre-commit
        language: system
        always_run: true
        pass_filenames: false
      - id: local-rules-commit-msg
        name: local rules (commit-msg)
        entry: pixi run --frozen -e lint python tools/local_hooks.py commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
      - id: ruff-isort
        name: ruff import sorting
        entry: pixi run --frozen -e lint ruff check --select I --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: pixi run --frozen -e lint ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mdformat
        name: mdformat
        entry: pixi run --frozen -e lint mdformat
        language: system
        types: [markdown]
        require_serial: true
