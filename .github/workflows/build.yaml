name: Build

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          environments: build
          locked: true
      - name: Discover version
        run: pixi run make-version
      - name: Build with Pyinstaller
        run:  pixi run -e build pyinstaller -y magic_afm_${RUNNER_OS::3}.spec
        shell: bash
      - name: Smoke test frozen GUI
        # MAFM_SMOKE_EXIT makes the GUI do one worker round trip and quit.
        # A crash opens a modal dialog, so timeout-minutes turns a hang into a failure.
        timeout-minutes: 5
        env:
          MAFM_SMOKE_EXIT: "1"
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/magic_afm/magic_afm_gui.exe
          else
            dist/magic_afm_gui.app/Contents/MacOS/magic_afm_gui
          fi
        shell: bash
      - name: Smoke test frozen CLI
        timeout-minutes: 2
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/magic_afm/magic_afm_cli.exe --help
          else
            dist/magic_afm_gui.app/Contents/MacOS/magic_afm_cli --help
          fi
        shell: bash
      - name: Show crash dumps
        if: failure()
        run: cat "$HOME/Library/Logs/MagicAFM/"*.dump "$LOCALAPPDATA/MagicAFM/Logs/"*.dump 2>/dev/null || true
        shell: bash
      - name: Tidy dist
        if: startsWith( runner.os, 'mac')
        # keep only the .app, in a dist/magic_afm folder like on Windows; the CLI
        # ships inside the bundle at Contents/MacOS/magic_afm_cli
        run: |
          rm -rf dist/magic_afm_gui
          mkdir dist/magic_afm
          mv dist/magic_afm_gui.app dist/magic_afm/
      - name: Copy README
        run: cp README.rst dist/magic_afm/
      - name: Zip app
        if: startsWith( runner.os, 'mac')
        # upload-artifact drops permissions and symlinks,
        # so zip it with ditto to keep the app working.
        # --norsrc leaves out xattrs, since
        # unzip would write it into the bundle as ._* files.
        run: |
          ditto -c -k --norsrc --keepParent dist/magic_afm dist/magic_afm_mac.zip
          rm -rf dist/magic_afm
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic_afm-${{ matrix.os }}-build
          path: dist/
          if-no-files-found: error
