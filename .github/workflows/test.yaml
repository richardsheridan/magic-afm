name: Test

on:
  # other branches run through their pull request, so a PR commit runs once
  push:
    branches: [master, "release-*"]
  pull_request:
  # also regenerates every golden set, uploaded as artifacts
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          # typecheck reads the test environment's interpreter
          environments: lint test
          locked: true
      - run: pixi run lint
      - run: pixi run typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # newest python with and without numba, oldest python with numba
        environment: [test, test-nonumba, test-py311]
    timeout-minutes: 30
    steps:
      # the real-data corpus is the public tests/magic-afm-test-data submodule
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          environments: ${{ matrix.environment }}
          locked: true
      # real-file fits can depend on the CPU model, not only the OS
      - name: Show CPU
        run: |
          case "$RUNNER_OS" in
            Linux) grep -m1 'model name' /proc/cpuinfo ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            Windows) powershell -Command '(Get-CimInstance Win32_Processor).Name' ;;
          esac
          # the SIMD features numpy dispatches to and the BLAS it loaded
          pixi run -e ${{ matrix.environment }} python -c "import numpy; numpy.show_runtime()"
        shell: bash
      # the GUI smoke test needs a display: Xvfb on Linux, the desktop elsewhere
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # the GUI smoke test runs under xvfb-run on Linux
      - id: pytest
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pixi run -e ${{ matrix.environment }} pytest -rfEs
        env:
          MAFM_GUI_TESTS: "1"
          # the submodule is public, so every run has the corpus, forks included
          MAFM_REQUIRE_REAL_DATA: "1"
      # when pytest fails, on a manual run, or when a pushed head commit message has
      # [regen-goldens], regenerate this platform's real-file goldens (the pixi test
      # envs pin the CPU-specific numerics) so drift can be measured with --compare
      - name: Regenerate goldens
        if: >-
          !cancelled() && (steps.pytest.outcome == 'failure'
          || github.event_name == 'workflow_dispatch'
          || contains(github.event.head_commit.message, '[regen-goldens]'))
        run: |
          pixi run -e ${{ matrix.environment }} python tests/goldens/make_t2_goldens.py --out-dir goldens --platform-only
          pixi run -e ${{ matrix.environment }} python tests/goldens/make_t3_goldens.py --out-dir goldens --platform-only
        shell: bash
      - name: Upload regenerated goldens
        if: >-
          !cancelled() && (steps.pytest.outcome == 'failure'
          || github.event_name == 'workflow_dispatch'
          || contains(github.event.head_commit.message, '[regen-goldens]'))
        uses: actions/upload-artifact@v4
        with:
          name: goldens-${{ matrix.os }}-${{ matrix.environment }}-${{ github.run_attempt }}
          path: goldens/
          if-no-files-found: warn
