name: Test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          # typecheck reads the test environment's interpreter
          environments: lint test
          locked: true
      - run: pixi run lint
      - run: pixi run typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # newest python with and without numba, oldest python with numba
        environment: [test, test-nonumba, test-py311]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          environments: ${{ matrix.environment }}
          locked: true
      # the GUI smoke test needs a display: Xvfb on Linux, the desktop elsewhere
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # tests marked slow skip here: CI has no example.data until T5b publishes it;
      # the GUI smoke test runs under xvfb-run on Linux
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pixi run -e ${{ matrix.environment }} pytest -rfEs
        env:
          MAFM_GUI_TESTS: "1"
      # when tests fail, regenerate the T2 goldens on this platform so every field's
      # drift can be measured offline with make_t2_goldens.py --compare
      - name: Regenerate T2 goldens
        if: failure()
        run: pixi run -e ${{ matrix.environment }} python tests/goldens/make_t2_goldens.py --out t2-goldens-${{ matrix.os }}-${{ matrix.environment }}.json
      - name: Upload regenerated T2 goldens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t2-goldens-${{ matrix.os }}-${{ matrix.environment }}
          path: t2-goldens-${{ matrix.os }}-${{ matrix.environment }}.json
          if-no-files-found: warn
