name: Test

on:
  push:
  pull_request:
  # also regenerates every golden set, uploaded as artifacts
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          # typecheck reads the test environment's interpreter
          environments: lint test
          locked: true
      - run: pixi run lint
      - run: pixi run typecheck

  # Fetch the files in tests/real_data_manifest.txt from the private corpus bucket
  # into one cache that every test job restores. The cache key is the manifest's
  # hash, so the bucket is read only when the manifest changes; a stale cache is
  # restored first and only missing or changed files are downloaded. Pull requests
  # from forks get no Google credentials, so they use whatever cache exists.
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: gs://magic-afm-test-cases-f8c5e4
      DATA_DIR: example.data/test_cases
    steps:
      - uses: actions/checkout@v4
      - name: Restore real-data cache
        id: cache
        uses: actions/cache@v4
        with:
          path: example.data/test_cases
          key: real-data-${{ hashFiles('tests/real_data_manifest.txt') }}
          restore-keys: real-data-
          enableCrossOsArchive: true
      - name: Authenticate to Google Cloud
        if: >-
          steps.cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: google-github-actions/auth@v3
        with:
          project_id: magic-afm-tests
          workload_identity_provider: projects/1049386035423/locations/global/workloadIdentityPools/github/providers/magic-afm
      - name: Download missing or changed files
        if: >-
          steps.cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euo pipefail
          # sha256 of the original file, whether stored raw or as .xz
          digest() {
            if [ "$2" = raw ]; then cat "$1"; else xz -dc "$1"; fi | sha256sum | cut -d' ' -f1
          }
          grep -v '^#' tests/real_data_manifest.txt | while read -r sum _ _ chain path; do
            obj=$path
            [ "$chain" = raw ] || obj=$path.xz
            dest=$DATA_DIR/$obj
            if [ -f "$dest" ] && [ "$(digest "$dest" "$chain")" = "$sum" ]; then
              echo "cached: $path"
              continue
            fi
            mkdir -p "$(dirname "$dest")"
            gcloud storage cp "$BUCKET/$obj" "$dest"
            if [ "$(digest "$dest" "$chain")" != "$sum" ]; then
              echo "::error::sha256 mismatch for $path"
              exit 1
            fi
          done

  test:
    needs: real-data
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # newest python with and without numba, oldest python with numba
        environment: [test, test-nonumba, test-py311]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          environments: ${{ matrix.environment }}
          locked: true
      # real-file fits can depend on the CPU model, not only the OS
      - name: Show CPU
        run: |
          case "$RUNNER_OS" in
            Linux) grep -m1 'model name' /proc/cpuinfo ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            Windows) powershell -Command '(Get-CimInstance Win32_Processor).Name' ;;
          esac
        shell: bash
      # tests marked slow skip when this misses (a fork's first pull request)
      - name: Restore real-data cache
        uses: actions/cache/restore@v4
        with:
          path: example.data/test_cases
          key: real-data-${{ hashFiles('tests/real_data_manifest.txt') }}
          restore-keys: real-data-
          enableCrossOsArchive: true
      # the GUI smoke test needs a display: Xvfb on Linux, the desktop elsewhere
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # the GUI smoke test runs under xvfb-run on Linux
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pixi run -e ${{ matrix.environment }} pytest -rfEs
        env:
          MAFM_GUI_TESTS: "1"
      # when tests fail, or on a manual run, regenerate the goldens on this platform
      # so every field's drift can be measured offline with --compare
      - name: Regenerate goldens
        if: failure() || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p goldens
          pixi run -e ${{ matrix.environment }} python tests/goldens/make_t2_goldens.py --out goldens/t2-${{ matrix.os }}-${{ matrix.environment }}.json
          pixi run -e ${{ matrix.environment }} python tests/goldens/make_t3_goldens.py --out goldens/t3-${{ matrix.os }}-${{ matrix.environment }}.json
        shell: bash
      - name: Upload regenerated goldens
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: goldens-${{ matrix.os }}-${{ matrix.environment }}
          path: goldens/
          if-no-files-found: warn
